<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Budget Planner</title>
    <!-- reset css -->
    <link rel="stylesheet" href="css/reset.css" />
    <!-- bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- css -->
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <header
      class="d-flex justify-content-center align-items-center bg-secondary"
    >
      <h1>Budget Planner</h1>
    </header>

    <nav class="container-fluid">
      <div class="row">
        <section class="budget-awal col text-center">
          Budget awal : <span class="budget">RP.3.000.000</span>
        </section>
        <section class="budget-terpakai col text-center">
          Budget terpakai : <span class="budget">RP.3.000.00</span>
        </section>
        <section class="budget-sisa col text-center">
          Budget sisa : <span class="budget">RP.3.000.00</span>
        </section>
      </div>
    </nav>
    <main class="container">
      <div class="button d-flex flex-column gap-3 my-3">
        <button class="btn btn-secondary tambah-pengeluaran-btn">
          Tambah Pengeluaran
        </button>
        <button class="btn btn-secondary daftar-transaksi-btn">
          Daftar Transaksi
        </button>
      </div>
      <section
        id="display-pengeluaran"
        class="input-pengeluaran position-absolute d-flex justify-content-center align-items-center"
      >
        <form
          class="tambah-form p-4 rounded-4 position-relative d-flex flex-column gap-2"
        >
          <h2 class="text-center">Pengeluaran</h2>
          <label class="label" for="nama">Nama :</label>
          <input
            class="inp inp-text w-100 rounded border border-secondary px-3 py-2"
            type="text"
          />
          <label class="label" for="jumlah">Jumlah :</label>
          <input
            class="inp inp-num w-100 rounded border border-secondary px-3 py-2"
            type="number"
          />
          <label class="label" for="tanggal">Tanggal :</label>
          <input
            class="inp inp-num w-100 rounded border border-secondary px-3 py-2"
            type="date"
          />

          <button
            type="submit"
            class="tambah-form-btn w-100 btn btn-warning mt-3"
          >
            Tambah
          </button>
          <button
            type="submit"
            class="close-form-btn position-absolute top-0 start-100 translate-middle btn btn-danger p-0 m-0"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="32"
              height="32"
              fill="currentColor"
              class="bi bi-x"
              viewBox="0 0 16 16"
            >
              <path
                d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708"
              />
            </svg>
          </button>
        </form>
      </section>
      <section class="daftar-transaksi">
        <table class="tabel-transaksi w-100">
          <tr>
            <th class="text-center">Tanggal</th>
            <th class="text-center">Nama</th>
            <th class="text-center">Jumlah</th>
          </tr>
          <tr>
            <td>01/12/2026</td>
            <td>Makan</td>
            <td>Rp. 10.000</td>
          </tr>
        </table>
      </section>
    </main>

    <!-- bootstrap -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <!-- main js -->
    <script type="module" src="js/main.js"></script>
  </body>
</html>
