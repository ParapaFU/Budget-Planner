<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Budget Planner</title>
    <!-- reset css -->
    <link rel="stylesheet" href="css/reset.css" />
    <!-- bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- css -->
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <header
      class="d-flex justify-content-center align-items-center bg-secondary"
    >
      <h1>Budget Planner</h1>
    </header>
    <nav class="budget row">
      <section
        class="budget-awal col text-center d-flex flex-column justify-content-center"
      >
        Budget awal : <span class="budget">RP.3.000.000</span>
      </section>
      <section
        class="budget-terpakai col text-center d-flex flex-column justify-content-center"
      >
        Budget terpakai : <span class="budget">RP.3.000.00</span>
      </section>
      <section
        class="budget-sisa col text-center d-flex flex-column justify-content-center"
      >
        Budget sisa : <span class="budget">RP.3.000.00</span>
      </section>
    </nav>
    <main class="position-relative">
      <button>Tambah Pengeluaran</button>
      <section class="input-pengeluaran position-absolute">
        <form>
          <input type="text" />
          <input type="number" />
          <select name="" id="">
            <option value=""></option>
          </select>
          <button>Tambah</button>
        </form>
      </section>
      <section class="daftar-transaksi">
        <ul>
          <li></li>
        </ul>
      </section>
    </main>

    <!-- bootstrap -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <!-- main js -->
    <script type="module" src="js/main.js"></script>
  </body>
</html>
